app = "study-bot"
primary_region = "nrt"
kill_signal = "SIGINT"
kill_timeout = 5

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"

[deploy]
  strategy = "immediate"
  max_unavailable = 1

[[services]]
  protocol = "tcp"
  internal_port = 8000
  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
    force_https = true
  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true
